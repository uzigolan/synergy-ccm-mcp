[project]
name = "synergy-mcp"
version = "0.1.0"
description = "MCP server exposing IBM Rational Synergy 7.2 (ccm CLI) as read-only tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "PyYAML>=6.0",
]

[project.scripts]
synergy-mcp = "synergy_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synergy_mcp"]
