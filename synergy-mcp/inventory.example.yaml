settings:
  ccm_binary: ccm
  command_timeout: 120
  start_timeout: 300
  max_rows: 500
  max_output_bytes: 200000

databases:
  - name: prod-core
    database: /ccmdb/prod
    server_url: http://synergy-host.example.com:8406
    role: developer
    user: synergy-user
    description: Example Synergy CCM database. Set the password with SYNERGY_MCP_PASSWORD.